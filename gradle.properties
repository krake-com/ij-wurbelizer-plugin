# Plugin coordinates
pluginGroup = org.wurbelizer.idea
pluginVersion = 0.1.0

# Target platform: the locally installed IntelliJ IDEA Ultimate 2026.2.1 (build 262).
# Using the local installation avoids downloading a ~1 GB platform artifact.
#
# The install location differs per machine, so it is deliberately NOT set here.
# The build auto-detects it (Toolbox launcher, then the usual install dirs).
# To override, set IDEA_HOME in the environment or add platformLocalPath to
# ~/.gradle/gradle.properties, e.g.
#   platformLocalPath = /opt/idea-IU                          (Linux)
#   platformLocalPath = /Applications/IntelliJ IDEA.app/Contents   (macOS)

# Compatibility range. Every API used by this plugin is long-stable; lower sinceBuild
# and re-run `verifyPlugin` if older IDEs need to be supported.
pluginSinceBuild = 262

org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.caching = true
org.gradle.configuration-cache = true
kotlin.stdlib.default.dependency = false
