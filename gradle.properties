# Plugin coordinates
pluginGroup = org.wurbelizer.idea
pluginVersion = 1.0.0

# Target platform the plugin is compiled against.
#
# Build against the LOWEST supported IDE so the artifact stays backwards compatible.
# Only com.intellij.java is required, which is bundled in IDEA Community, so IC is
# enough and keeps the compatible-product list accurate.
platformType = IC
platformVersion = 2025.1

# Compatibility range. untilBuild is deliberately left open (see build.gradle.kts);
# `verifyPlugin` checks the range from pluginSinceBuild up to the newest release.
pluginSinceBuild = 251

# Development convenience: to compile against a locally installed IDE instead of the
# downloaded platform artifact, set IDEA_HOME in the environment or add
# platformLocalPath to ~/.gradle/gradle.properties, e.g.
#   platformLocalPath = /opt/idea-IU                                (Linux)
#   platformLocalPath = /Applications/IntelliJ IDEA.app/Contents    (macOS)
# Use the directory containing build.txt. Never use this for a release build.
# Do not run the tests against it either: a unified IDEA 2025.3+ installation carries the
# Ultimate modules, whose extensions cannot be created under the test framework, so almost
# every fixture test fails. Override it with -PplatformLocalPath= when running `test`.

# Release secrets belong in ~/.gradle/gradle.properties, never in this file:
#   signCertificateChainFile, signPrivateKeyFile, signPrivateKeyPassword
#   intellijPlatformPublishingToken

org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.caching = true
org.gradle.configuration-cache = true
kotlin.stdlib.default.dependency = false
